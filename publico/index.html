<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · NeuroRitmo Digital</title>
  <meta name="description" content="NeuroRitmo Digital: Misión Cerebro Sonoro. Aventura de aprendizaje gamificada de la UNEMI sobre atención, memoria y autorregulación con música, guiada por Neuri.">
  <meta name="application-name" content="NeuroRitmo Digital">
  <meta name="theme-color" content="#0B3850">
  <link rel="stylesheet" href="/css/tokens.css">

</head>
<body>
  <div id="plantilla"></div>
