# despliegue/nginx-ecosistema.conf
# Proxy inverso de Nginx para el Ecosistema Educativo Digital (ver docs/despliegue.md).
# Reemplaza DOMINIO por tu dominio real antes de copiarlo a /etc/nginx/sites-available/.
# Certbot agregará después el bloque HTTPS (puerto 443) y la redirección desde HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # Subidas: ajustes.maxSubidaMB = 10 MB (docentes y admin) + margen para el formulario.
    # Si cambias maxSubidaMB en datos/config/ajustes.json, ajusta también este valor.
    client_max_body_size 12m;

    # Oculta la versión de Nginx y la cabecera de Express
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # Cabeceras comunes hacia Node
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Archivos estáticos con caché en el navegador.
    # CSS y JS: 1 hora (los nombres no cambian entre versiones; tras actualizar, Ctrl + F5).
    # (Express envía "Cache-Control: max-age=0"; se oculta para que valga solo el de "expires")
    location ~ ^/(css|js)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        expires 1h;
        access_log off;
    }

    # Imágenes, audios y subidas (las subidas tienen nombres únicos): 7 días
    location /recursos/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        expires 7d;
        access_log off;
    }

    # API: sin caché; la IA puede tardar hasta 60 s
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }

    # Páginas HTML y todo lo demás
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
